name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Naveen-Negi721700
          outputs: |
            assets/contribution-snake.svg?color_snake=%23C77B9B&color_dots=%23190B12,%23451126,%23701A3D,%23C77B9B,%23E5B5C7

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push