<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="YOUR NAME - YOUR ROLE  |  YOUR ROLE 2  |  YOUR ROLE 3">
<title>YOUR NAME - YOUR ROLE  |  YOUR ROLE 2  |  YOUR ROLE 3</title>
<defs>
<linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10070C"/><stop offset="60%" stop-color="#190B12"/><stop offset="100%" stop-color="#451126"/></linearGradient>
<linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#701A3D" stop-opacity="0"/><stop offset="50%" stop-color="#C77B9B"/><stop offset="100%" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
<pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.06"/></pattern>
<filter id="hero-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<radialGradient id="hero-light" cx="0.8" cy="0.25" r="0.65"><stop offset="0%" stop-color="#701A3D" stop-opacity="0.7"><animate attributeName="stop-opacity" values="0.45;0.8;0.45" dur="7s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="440" rx="18" fill="url(#hero-bg)"/>
<rect width="1200" height="440" rx="18" fill="url(#hero-grid)"/>
<rect x="0.5" y="0.5" width="1199" height="439" rx="18" fill="none" stroke="#C77B9B" stroke-opacity="0.25"/>

<rect width="1200" height="440" rx="18" fill="url(#hero-light)"/>
<g fill="none" stroke="#C77B9B" stroke-opacity="0.35">
<circle cx="980" cy="220" r="120"/>
<ellipse cx="980" cy="220" rx="170" ry="62" transform="rotate(-20 980 220)"/>
<circle cx="980" cy="220" r="60" stroke-opacity="0.2"/>
</g>
<circle r="5" fill="#E5B5C7"><animateMotion dur="9s" repeatCount="indefinite" path="M980,100 a120,120 0 1,1 -0.1,0"/></circle>
<path d="M40 380 C 260 320, 400 410, 580 350 S 900 300, 1160 360" fill="none" stroke="#C77B9B" stroke-width="2" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="0" opacity="0.8">
<animate attributeName="stroke-dashoffset" values="1400;0;0" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/></path>
<text x="70" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" font-style="normal" fill="#F8F0F3" text-anchor="start" letter-spacing="1">YOUR NAME</text>
<text x="72" y="240" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="21" font-weight="400" font-style="normal" fill="#E5B5C7" text-anchor="start" letter-spacing="3">YOUR ROLE  |  YOUR ROLE 2  |  YOUR ROLE 3</text>
<text x="72" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" font-style="italic" fill="#C77B9B" text-anchor="start" letter-spacing="0">Your one-line motto goes here.</text>
<rect x="72" y="258" width="460" height="3" rx="1.5" fill="url(#hero-line)" filter="url(#hero-blur)"/><rect x="72" y="258" width="460" height="3" rx="1.5" fill="url(#hero-line)"><animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/></rect>

</svg>
