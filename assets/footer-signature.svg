<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Turning coffee into clean code and complex algorithms into seamless user experiences." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Turning coffee into clean code and complex algorithms into seamless user experiences.</title>
<defs>
